name: Documentation

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'latest' }}
          submodules: recursive

      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.4.0"

      - name: Install documentation tools
        run: brew bundle --file Brewfile-ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Generate documentation
        env:
          HOSTING_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: just docs "$HOSTING_BASE_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/documentation

  deploy-github-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
