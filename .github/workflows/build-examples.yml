name: Build Examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.example }} (${{ matrix.os }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        example: [Clock, Keyboard, NotesBrowser, Sandbox]
        os: [macos-latest, ubuntu-latest]
        configuration: [debug, release]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.4.0"

      - name: Install Just on macOS
        if: runner.os == 'macOS'
        run: brew install just

      - name: Install Just on Linux
        if: runner.os == 'Linux'
        run: cargo install just --locked --version 1.58.0

      - name: Build example package
        env:
          EXAMPLE: ${{ matrix.example }}
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          just build --package-path "Examples/$EXAMPLE" \
            --scratch-path ".build/examples/$EXAMPLE" \
            -c "$CONFIGURATION"

  build-examples-required-check:
    name: Build Examples - Required Check
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
