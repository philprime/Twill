name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        configuration: [debug, release]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.4.0"

      - name: Install Just on macOS
        if: runner.os == 'macOS'
        run: brew install just

      - name: Install Just on Linux
        if: runner.os == 'Linux'
        run: cargo install just --locked --version 1.58.0

      - name: Build package
        run: just build -c "${{ matrix.configuration }}"

  build-required-check:
    name: Build - Required Check
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
