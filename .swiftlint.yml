included:
  - Package.swift
  - Sources
  - Tests
  - Examples
  - Tools

excluded:
  - .build
  - .git
  - .agents
  - .pi
  - dist

opt_in_rules:
  - missing_docs

missing_docs:
  error: [open, public]
  excludes_extensions: false
  excludes_inherited_types: false
  excludes_trivial_init: false
  evaluate_effective_access_control_level: true

disabled_rules:
  - trailing_comma

line_length:
  warning: 120
nesting:
  type_level:
    warning: 3
  function_level:
    warning: 3
type_name:
  max_length:
    warning: 60
    error: 100
